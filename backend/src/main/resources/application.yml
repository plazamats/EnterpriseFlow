spring:
  application.name: enterpriseflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterpriseflow}
    username: ${DB_USERNAME:enterpriseflow}
    password: ${DB_PASSWORD:enterpriseflow}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-256-bit-value}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
management.endpoints.web.exposure.include: health,info
