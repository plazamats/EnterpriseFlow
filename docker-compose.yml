services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterpriseflow
      POSTGRES_USER: enterpriseflow
      POSTGRES_PASSWORD: enterpriseflow
    ports: ["5432:5432"]
    volumes: [enterpriseflow-data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    depends_on: [postgres]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/enterpriseflow
      DB_USERNAME: enterpriseflow
      DB_PASSWORD: enterpriseflow
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  enterpriseflow-data:
